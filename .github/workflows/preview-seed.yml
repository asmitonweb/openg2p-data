name: OAN ATI preview seed
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact reviewed catalogue source commit"
        required: true
        default: "c8619aacd863c18dafabb30d1ed81697749d702e"
permissions:
  contents: read
  packages: write
concurrency:
  group: oan-ati-preview-seed
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'asmitonweb/openg2p-data'
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      IMAGE: ghcr.io/asmitonweb/master-data-db-seed
    steps:
      - name: Require the reviewed immutable source
        run: |
          test "$SOURCE_COMMIT" = c8619aacd863c18dafabb30d1ed81697749d702e
          echo "TAG=oan-ati-preview-${SOURCE_COMMIT:0:12}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate exact source and pinned native base
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          bash ci/validate.sh
          grep -Fx 'ARG BASE=openg2p/master-data-db-seed:0.0.0-develop.118@sha256:cfa91c1bcc1798a8a82454073ac5454c8099041511bf6d0c7380b492232d809f' docker/master-data-db-seed/Dockerfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail closed unless preview tag is absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          name = 'asmitonweb/master-data-db-seed'
          credentials = base64.b64encode((os.environ['GITHUB_ACTOR']+':'+os.environ['GH_TOKEN']).encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?service=ghcr.io&scope=repository:'+name+':pull', headers={'Authorization':'Basic '+credentials})
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['token']
          request = urllib.request.Request('https://ghcr.io/v2/'+name+'/manifests/'+os.environ['TAG'], headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'})
          try:
              with urllib.request.urlopen(request):
                  raise SystemExit('Preview tag already exists; refusing replacement')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Cannot prove tag absence: HTTP '+str(error.code)) from None
          print('Preview tag is absent')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/master-data-db-seed/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/asmitonweb/openg2p-data
            org.opencontainers.image.revision=${{ inputs.source_commit }}
            org.opencontainers.image.base.digest=sha256:cfa91c1bcc1798a8a82454073ac5454c8099041511bf6d0c7380b492232d809f
            org.openg2p.pin.openg2p-data-repo=https://github.com/asmitonweb/openg2p-data.git
            org.openg2p.pin.openg2p-data-branch=${{ inputs.source_commit }}
      - name: Verify authenticated pull and record immutable provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")" = "$SOURCE_COMMIT"
          python - <<'PY'
          import json, os
          result = {'image':os.environ['IMAGE'], 'tag':os.environ['TAG'], 'digest':os.environ['DIGEST'], 'source_commit':os.environ['SOURCE_COMMIT'], 'native_base':'openg2p/master-data-db-seed:0.0.0-develop.118@sha256:cfa91c1bcc1798a8a82454073ac5454c8099041511bf6d0c7380b492232d809f', 'authenticated_pull':'passed', 'anonymous_pull':'not checked', 'deployment':'not performed'}
          with open('preview-seed-provenance.json','w') as stream: json.dump(result,stream,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write('```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-seed-provenance
          path: preview-seed-provenance.json
