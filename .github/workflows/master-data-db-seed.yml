# Builds and publishes the Master Data db-seed image carrying this repository's
# packs (docker/master-data-db-seed/Dockerfile) to GitHub Container Registry.
#
# Push a tag named master-data-db-seed/<image tag>, for example
# master-data-db-seed/0.0.0-develop.118-oan.1, at the commit to ship. The image
# is ghcr.io/<owner>/master-data-db-seed:<image tag>; the job prints its digest,
# which is what a chart pins.
name: master-data-db-seed

on:
  push:
    tags:
      - "master-data-db-seed/*"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: bash ci/validate.sh
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/master-data-db-seed" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#master-data-db-seed/}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/master-data-db-seed/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=master-data-db-seed
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.openg2p.pin.openg2p-data-repo=https://github.com/${{ github.repository }}.git
            org.openg2p.pin.openg2p-data-branch=${{ github.sha }}

      - name: Digest
        run: echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
